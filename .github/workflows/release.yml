name: Release

on:
  push:
    tags: ["v*"]

# Creating the release and uploading its assets is a write to the repository.
permissions:
  contents: write

jobs:
  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # goreleaser builds the changelog from the history, which a shallow
          # clone does not have.
          fetch-depth: 0
          # goreleaser is given the token it needs through the environment.
          # Leaving a second copy in the git config would put it within reach
          # of everything else the release runs, the test hook included.
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: go.mod

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
