name: Release

on:
  push:
    tags: ["v*"]

# Creating the release and uploading its assets is a write to the repository.
permissions:
  contents: write

jobs:
  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser builds the changelog from the history, which a shallow
          # clone does not have.
          fetch-depth: 0
          # goreleaser is given the token it needs through the environment.
          # Leaving a second copy in the git config would put it within reach
          # of everything else the release runs, the test hook included.
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: go.mod

      # The release notes are the section of CHANGELOG.md for this tag, with
      # the install section after it. A release without a section is a release
      # nobody wrote notes for, and stops here rather than being published
      # with an empty body. They are written outside the checkout, since
      # goreleaser refuses to release from a work tree that holds a file git
      # does not know about.
      - name: Read the release notes
        run: |
          awk -v tag="$TAG" '
            $1 == "##" && $2 == tag { found = 1; next }
            found && $1 == "##" { exit }
            found { print }
          ' CHANGELOG.md > "$NOTES"
          if [ ! -s "$NOTES" ]; then
            echo "CHANGELOG.md has no section for $TAG" >&2
            exit 1
          fi
          sed "s|{{TAG}}|$TAG|" .github/release-install.md >> "$NOTES"
        env:
          TAG: ${{ github.ref_name }}
          NOTES: ${{ runner.temp }}/release-notes.md

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # goreleaser builds and uploads the binaries; the body is written here,
      # from the file above. Its own --release-notes silently published an
      # empty body, and a release whose notes are written by hand is better
      # served by the one step that does nothing else.
      - name: Write the release body
        run: gh release edit "$TAG" --notes-file "$NOTES"
        env:
          TAG: ${{ github.ref_name }}
          NOTES: ${{ runner.temp }}/release-notes.md
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
