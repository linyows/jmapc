name: Test

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository; nothing it runs needs to write back.
permissions:
  contents: read

# Pushing again to a branch makes the run already in flight pointless: what
# matters is whether the tip is green. Cancelling it frees the runners for the
# commit anyone is actually waiting on.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide what the others would have said.
      fail-fast: false
      matrix:
        include:
          # The oldest Go the module claims to support, and the newest.
          - {os: ubuntu-latest, go: "1.25.x"}
          - {os: ubuntu-latest, go: "stable"}
          # jmapc is a library, and generation walks the filesystem, so the
          # other platforms are worth a run of their own.
          - {os: macos-latest, go: "stable"}
          - {os: windows-latest, go: "stable"}
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing here writes back, so the job has no use for a credential
          # in the git config.
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          # The module has no dependencies, so there is no go.sum for the
          # cache to key on.
          cache-dependency-path: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing here writes back, so the job has no use for a credential
          # in the git config.
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            echo
            gofmt -d $unformatted
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # The runtime types and the example client are generated from the
      # catalogue. Regenerating them here catches a change to the data model
      # that was made without regenerating what depends on it.
      - name: go generate leaves no changes
        run: |
          go generate ./...
          git diff --exit-code

      - name: go mod tidy leaves no changes
        run: |
          go mod tidy
          git diff --exit-code

  # The TypeScript jmapc generates has to compile, which Go's tests cannot say.
  typescript:
    name: typescript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing here writes back, so the job has no use for a credential
          # in the git config.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          # Named rather than left to lts/*, so that a run tomorrow is the run
          # today was: what the LTS is changes under a workflow that does not
          # say which one it means.
          node-version: "24"

      - name: tsc --strict over the generated client
        working-directory: example/ts
        run: npx --yes -p typescript@5 tsc --noEmit

      # What the runtime does when it runs, which tsc cannot say: that the
      # headers go out, that auth wins over them, that the session is cached.
      - name: Run the generated client against a stub
        working-directory: example/ts
        run: |
          npx --yes -p typescript@5 tsc -p tsconfig.node.json
          node dist/check.js

  # The JSON Schema jmapc writes describes the query files, and whether it
  # accepts the queries in this repository and refuses the mistakes it claims
  # to catch is something Go's tests cannot say without a validator.
  schema:
    name: schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing here writes back, so the job has no use for a credential
          # in the git config.
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: go.mod

      - uses: actions/setup-node@v4
        with:
          # The Node the TypeScript job names, for the reason it names one.
          node-version: "24"

      - name: Write the schema
        run: go run ./cmd/jmapc schema -out example/schema/jmapc.schema.json

      - name: Check it against the example queries, and against mistakes
        working-directory: example/schema
        run: |
          npm install --no-audit --no-fund
          node check.mjs

  # The Rust jmapc generates has to compile too, and it is generated to the
  # layout rustfmt would have produced, so the formatter is a check on it
  # rather than a step that rewrites it.
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing here writes back, so the job has no use for a credential
          # in the git config.
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt over the generated client
        working-directory: example/rust
        run: cargo fmt --check

      # What the runtime does when it runs, which the compiler cannot say:
      # that the headers go out, that auth wins over them, that the session is
      # cached, and that a /set answering 200 with a refusal is still an error.
      - name: Build and run the generated client against a stub
        working-directory: example/rust
        run: cargo test
