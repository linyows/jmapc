# The module has no Go dependencies, so the only thing here to keep current is
# the set of actions the workflow uses.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      # init and analyze are two steps of one action, released together, and
      # a run whose steps are at different versions fails, so they are bumped
      # in one pull request rather than one each.
      codeql:
        patterns:
          - "github/codeql-action*"
