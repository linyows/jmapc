# The end-to-end tests: Stalwart started in a container, set up, and the
# scenarios run against it, all in this one workflow. Run it from the
# repository root:
#
#   probe e2e/workflow.yml
#
# Every setting has a default and can be given in the environment instead:
# E2E_HTTP_PORT, E2E_SMTP_PORT, E2E_IMAP_PORT and E2E_PUSH_PORT for the ports
# on this side, E2E_CONTAINER for the container's name, the passwords as
# E2E_RECOVERY_PASSWORD, E2E_ALICE_PASSWORD, E2E_BOB_PASSWORD and
# E2E_CAROL_PASSWORD, which are generated for the run otherwise, and
# E2E_KEEP=1 to leave the container running afterwards, to log into with the
# passwords given.
#
# Each scenario does something through jmapc and checks it over a path that
# does not go through jmapc, or the other way round, so that a mistake in what
# jmapc sends cannot be hidden by the same mistake in what it reads back.
# The other path's JMAP requests are made by probe-jmap, an action Probe
# downloads on first use and checks against the checksum the pinned commit
# names. It fetches the session and fills in the account as jmapc does, and
# shares no code with it.
#
# Outputs are kept for the whole run and can be read by name alone, so an
# output is not named after the id of any step: outputs.domain.id would
# otherwise find an output named domain rather than the step.
name: jmapc against Stalwart

vars:
  # The release the tests are written against. Stalwart moves its settings
  # between minor versions, so a new one is a change to make here on purpose.
  image: stalwartlabs/stalwart:v0.16@sha256:ec011be228596e37e65f41aab17deed573859614430472f7eeb42178c50d87b7
  container: "{{E2E_CONTAINER ?? 'jmapc-e2e'}}"
  http_port: "{{E2E_HTTP_PORT ?? '18080'}}"
  smtp_port: "{{E2E_SMTP_PORT ?? '10025'}}"
  imap_port: "{{E2E_IMAP_PORT ?? '10993'}}"
  base: "http://localhost:{{vars.http_port}}"
  smtp: "localhost:{{vars.smtp_port}}"
  imap_host: localhost
  # Where the driver is built, removed when the workflow ends. It is always
  # made for the run, never given, since it is removed whole.
  work: "{{'/tmp/jmapc-e2e-' + random_str(12)}}"
  keep: "{{E2E_KEEP ?? ''}}"
  # The administrator the container is started with, given to it as
  # user:password.
  recovery_password: "{{E2E_RECOVERY_PASSWORD ?? random_str(24)}}"
  recovery_admin: "admin:{{vars.recovery_password}}"
  domain: example.test
  alice_password: "{{E2E_ALICE_PASSWORD ?? random_str(24)}}"
  bob_password: "{{E2E_BOB_PASSWORD ?? random_str(24)}}"
  carol_password: "{{E2E_CAROL_PASSWORD ?? random_str(24)}}"
  # Where the driver receives pushes. Stalwart posts only to https, and only
  # to a name rather than a private address, so the container resolves this
  # name to the host and trusts a CA made for the run.
  push_host: push.jmapc.test
  push_port: "{{E2E_PUSH_PORT ?? '18443'}}"
  # Marks what one run writes, so that runs against the same server do not
  # read each other's mail.
  run_id: "{{random_str(8)}}"

# The sender of every delivery, merged into the jobs' defaults: probe leaves
# a top-level key that starts with x- alone. Stalwart offers STARTTLS with a
# certificate it made for itself, as a server delivering mail between
# servers takes without checking.
x-remote-smtp: &remote_smtp
  addr: "{{vars.smtp}}"
  insecure_skip_tls: true
  myhostname: mail.remote.test
  from: someone@remote.test

# The action the JMAP requests are made with, named once: a step uses it as
# *jmap, and a job's defaults are keyed by it. Probe resolves an action
# before anything is evaluated, so it cannot come from vars, and takes one
# only at a full commit, here the one whose action.yml names the release.
x-jmap: &jmap github.com/mozership/probe-jmap@f64bf107c6fd7435c4bb3f84e2f9116da761aadf # v0.3.0

secrets:
  - E2E_RECOVERY_PASSWORD
  - E2E_ALICE_PASSWORD
  - E2E_BOB_PASSWORD
  - E2E_CAROL_PASSWORD

jobs:
- name: Start and provision the server
  id: server
  # Stalwart's own methods are under a capability probe-jmap cannot tell from
  # their names, so it is given, to add to what the names do tell.
  defaults:
    *jmap :
      url: "{{vars.base}}"
      using_also: ["urn:stalwart:jmap"]
  steps:
  # Before anything is started, so that whatever happens next, the container
  # and the work directory go when the workflow ends: Probe stops a background
  # command then, as it does when it is interrupted. E2E_KEEP=1 leaves both.
  - name: Remove the container and the work directory when the workflow ends
    uses: shell
    skipif: vars.keep == "1"
    with:
      cmd: "trap 'docker rm -f {{vars.container}} >/dev/null 2>&1; rm -rf {{vars.work}}; exit 0' TERM INT; while :; do sleep 1; done"
      background: true
    test: status == -1

  # STALWART_PUBLIC_URL is what the session's URLs are built from. Without it
  # they name the server's hostname, which nothing outside the container
  # resolves.
  # A CA made for the run, and a certificate for the name pushes are posted
  # to, which the driver serves and the container is told to trust.
  - name: Make a CA and a certificate for the push receiver
    uses: shell
    with:
      cmd: >-
        mkdir -p {{vars.work}} && cd {{vars.work}} &&
        openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -days 1
        -subj "/CN=jmapc e2e CA" -keyout ca.key -out ca.pem
        -addext basicConstraints=critical,CA:TRUE -addext keyUsage=critical,keyCertSign &&
        openssl req -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes
        -subj /CN={{vars.push_host}} -keyout push.key -out push.csr &&
        printf 'subjectAltName=DNS:{{vars.push_host}}\nextendedKeyUsage=serverAuth\n' > push.ext &&
        openssl x509 -req -in push.csr -CA ca.pem -CAkey ca.key -CAcreateserial -days 1
        -out push.pem -extfile push.ext
    test: res.code == 0

  # SSL_CERT_FILE is the store Stalwart checks a push receiver's certificate
  # against, and host-gateway is the host from inside the container.
  - name: Start Stalwart
    uses: shell
    with:
      cmd: >-
        docker rm -f {{vars.container}} >/dev/null 2>&1;
        docker run -d --name {{vars.container}}
        -p {{vars.http_port}}:8080 -p {{vars.smtp_port}}:25 -p {{vars.imap_port}}:993
        -e STALWART_RECOVERY_ADMIN={{vars.recovery_admin}}
        -e STALWART_PUBLIC_URL={{vars.base}}
        --add-host {{vars.push_host}}:host-gateway
        -v {{vars.work}}/ca.pem:/etc/jmapc-e2e-ca.pem:ro
        -e SSL_CERT_FILE=/etc/jmapc-e2e-ca.pem
        {{vars.image}}
      timeout: 5m
    test: res.code == 0

  # A step of probe-jmap without calls fetches the session alone.
  - name: Wait for bootstrap mode
    uses: *jmap
    retry: {max_attempts: 60, interval: 1s}
    test: status == 0

  # Certificates and DKIM keys are left out: nothing outside the container
  # reaches it by name, and no mail leaves it.
  - name: Complete bootstrap
    id: boot
    uses: *jmap
    with:
      basic_auth:
        username: admin
        password: "{{vars.recovery_password}}"
      calls:
      - method: x:Bootstrap/set
        id: boot
        args:
          update:
            singleton:
              serverHostname: "mail.{{vars.domain}}"
              defaultDomain: "{{vars.domain}}"
              requestTlsCertificate: false
              generateDkimKeys: false
    test: status == 0 && res.results.boot.updated.singleton.secret != ""
    outputs:
      user: res.results.boot.updated.singleton.username
      secret: res.results.boot.updated.singleton.secret

  # Bootstrap writes the configuration and leaves the server as it was, in
  # bootstrap mode, until it starts again.
  - name: Restart out of bootstrap mode
    uses: shell
    with:
      cmd: docker restart {{vars.container}}
      timeout: 60s
    test: res.code == 0

  - name: Wait for the server
    uses: *jmap
    with:
      # The administrator bootstrap made, which the steps after this one log
      # in as too.
      basic_auth: &admin
        username: "{{outputs.boot.user}}"
        password: "{{outputs.boot.secret}}"
    retry: {max_attempts: 60, interval: 1s}
    test: status == 0 && res.session.username == outputs.boot.user

  - name: Find the domain bootstrap created
    id: domain
    uses: *jmap
    with:
      basic_auth: *admin
      calls:
      - method: x:Domain/query
        id: find
        args: {filter: {name: "{{vars.domain}}"}}
    test: status == 0 && len(res.results.find.ids) == 1
    outputs:
      id: res.results.find.ids[0]

  # Stalwart's lists are written as maps keyed by position, which is why the
  # one credential is under "0". bob and carol are alice with their own name
  # and password.
  - name: Create alice, bob and carol
    uses: *jmap
    with:
      basic_auth: *admin
      calls:
      - method: x:Account/set
        id: accounts
        args:
          create:
            alice: &user
              "@type": User
              name: alice
              domainId: "{{outputs.domain.id}}"
              credentials: {"0": {"@type": Password, secret: "{{vars.alice_password}}"}}
              roles: {"@type": User}
              permissions: {"@type": Inherit}
              quotas: {}
              aliases: {}
              memberGroupIds: {}
              encryptionAtRest: {"@type": Disabled}
            bob:
              <<: *user
              name: bob
              credentials: {"0": {"@type": Password, secret: "{{vars.bob_password}}"}}
            carol:
              <<: *user
              name: carol
              credentials: {"0": {"@type": Password, secret: "{{vars.carol_password}}"}}
    test: status == 0 && len(res.results.accounts.created) == 3

- name: Build the driver
  id: driver
  steps:
  - name: go build
    uses: shell
    with:
      cmd: mkdir -p {{vars.work}} && go build -o {{vars.work}}/driver ./e2e/driver
      timeout: 5m
    test: res.code == 0

- name: The session as jmapc reads it
  needs: [server, driver]
  # Requests made directly and the driver both log in as alice, here and in
  # the other jobs that work in her account.
  defaults: &alice
    http:
      url: "{{vars.base}}"
      basic_auth:
        username: "alice@{{vars.domain}}"
        password: "{{vars.alice_password}}"
    *jmap :
      url: "{{vars.base}}"
      basic_auth:
        username: "alice@{{vars.domain}}"
        password: "{{vars.alice_password}}"
    smtp: *remote_smtp
    shell:
      env:
        JMAPC_E2E_SESSION_URL: "{{vars.base}}/.well-known/jmap"
        JMAPC_E2E_USER: "alice@{{vars.domain}}"
        JMAPC_E2E_PASSWORD: "{{vars.alice_password}}"
  steps:
  - name: Fetch the session directly
    id: raw
    uses: *jmap
    test: status == 0
    # The fields the driver prints, read from the session as the server
    # wrote it, for match_json to compare whole.
    outputs:
      session: |
        {
          username: res.session.username,
          apiUrl: res.session.apiUrl,
          downloadUrl: res.session.downloadUrl,
          uploadUrl: res.session.uploadUrl,
          eventSourceUrl: res.session.eventSourceUrl,
          mailAccountId: res.session.primaryAccounts['urn:ietf:params:jmap:mail'],
          capabilities: sort(keys(res.session.capabilities)),
          maxCallsInRequest: res.session.capabilities['urn:ietf:params:jmap:core'].maxCallsInRequest,
          maxObjectsInGet: res.session.capabilities['urn:ietf:params:jmap:core'].maxObjectsInGet,
        }

  - name: Fetch it through jmapc
    uses: shell
    with:
      cmd: "{{vars.work}}/driver session"
    test: res.code == 0 && match_json(res.json, outputs.raw.session)

  # SendReadReceipt uses MDN, and the rest only what this server serves. What
  # Verify has to report follows from the session fetched directly: nothing
  # where it advertises MDN, and SendReadReceipt alone where it does not, as
  # Stalwart 0.16 does not.
  - name: Verify every request through jmapc
    uses: shell
    with:
      cmd: "{{vars.work}}/driver verify"
    test: |
      res.code == 0 &&
      'urn:ietf:params:jmap:mdn' in outputs.raw.session.capabilities &&
        len(res.json.problems) == 0 ||
      res.code == 0 &&
      !('urn:ietf:params:jmap:mdn' in outputs.raw.session.capabilities) &&
        len(res.json.problems) == 1 &&
        res.json.problems[0].request == 'SendReadReceipt' &&
        res.json.problems[0].error contains 'urn:ietf:params:jmap:mdn'

- name: Mail delivered over SMTP, found through jmapc
  needs: [server, driver]
  defaults: *alice
  steps:
  # The subject carries the run id, and probe appends a tracking id of its
  # own, so the search below matches this delivery and no other.
  - name: Deliver to alice on port 25
    uses: smtp
    with:
      to: "alice@{{vars.domain}}"
      subject: "inbound {{vars.run_id}}"
    test: res.code == 0 && res.sent == 1

  - name: Find it through the generated client
    id: found
    uses: shell
    with:
      cmd: "{{vars.work}}/driver find-emails -subject 'inbound {{vars.run_id}}'"
    retry: {max_attempts: 20, interval: 1s}
    test: |
      res.code == 0 &&
      res.json.count == 1 &&
      res.json.emails[0].from[0] == 'someone@remote.test' &&
      res.json.emails[0].to[0] == 'alice@' + vars.domain &&
      res.json.emails[0].mailboxes == 1
    outputs:
      id: res.json.emails[0].id

  - name: Find the same email directly
    uses: *jmap
    with:
      calls:
      - method: Email/query
        id: search
        args: {filter: {subject: "inbound {{vars.run_id}}"}}
    test: status == 0 && res.results.search.ids == [outputs.found.id]

- name: Mail imported through jmapc, read over IMAP
  needs: [server, driver]
  defaults:
    <<: *alice
    imap:
      host: "{{vars.imap_host}}"
      port: "{{vars.imap_port}}"
      username: "alice@{{vars.domain}}"
      password: "{{vars.alice_password}}"
      # The certificate is the one Stalwart makes for itself, for a name
      # nothing here resolves.
      insecure_skip_tls: true
  steps:
  - name: Import a flagged message through the generated client
    id: imported
    uses: shell
    with:
      cmd: "{{vars.work}}/driver import-email -subject 'imported {{vars.run_id}}'"
    test: res.code == 0 && res.json.id != ""
    outputs:
      id: res.json.id

  # The keywords set through JMAP are the flags IMAP shows: $flagged is
  # \Flagged, and a message not yet read has no \Seen. The fetch acts on what
  # the search found.
  - name: Find it in the inbox over IMAP, flagged and unread
    uses: imap
    with:
      commands:
      - name: select
        mailbox: INBOX
      - name: uid search
        criteria:
          headers:
            Subject: "imported {{vars.run_id}}"
      - name: uid fetch
        dataitem: ALL
    test: |
      status == 0 &&
      res.data.search.count == 1 &&
      len(res.data.fetch.messages) == 1 &&
      res.data.fetch.messages[0].subject == 'imported ' + vars.run_id &&
      '\\Flagged' in res.data.fetch.messages[0].flags &&
      !('\\Seen' in res.data.fetch.messages[0].flags)

  # A change made over IMAP, for jmapc to see.
  - name: Mark it read over IMAP
    uses: imap
    with:
      commands:
      - name: select
        mailbox: INBOX
      - name: uid search
        criteria:
          headers:
            Subject: "imported {{vars.run_id}}"
      - name: uid store
        dataitem: +FLAGS
        value: '\Seen'
    test: status == 0 && res.data.store.count == 1

  - name: See it read through the generated client
    uses: shell
    with:
      cmd: "{{vars.work}}/driver find-emails -subject 'imported {{vars.run_id}}'"
    test: |
      res.code == 0 &&
      res.json.count == 1 &&
      res.json.emails[0].id == outputs.imported.id &&
      res.json.emails[0].keywords == ['$flagged', '$seen']

- name: A blob uploaded through jmapc, downloaded directly
  needs: [server, driver]
  defaults: *alice
  steps:
  # jmapc uploads the content and reads back the whole of it, and asks for
  # octets 5 to 12 of it.
  - name: Upload and download it through jmapc
    id: blob
    uses: shell
    with:
      cmd: "{{vars.work}}/driver blob -data 'blob {{vars.run_id}} 0123456789' -from 5 -length 8"
    test: |
      res.code == 0 &&
      res.json.whole == 'blob ' + vars.run_id + ' 0123456789' &&
      res.json.size == len('blob ' + vars.run_id + ' 0123456789')
    outputs:
      accountId: res.json.accountId
      blobId: res.json.blobId
      part: res.json.part ?? ''
      rangeIgnored: res.json.rangeIgnored ?? false

  - name: Download the whole of it directly
    uses: http
    with:
      get: "/jmap/download/{{outputs.blob.accountId}}/{{outputs.blob.blobId}}/blob.txt?accept=text/plain"
    test: res.code == 200 && res.body == 'blob ' + vars.run_id + ' 0123456789'

  # JMAP leaves ranges to the server. One that honours the range answers 206,
  # and jmapc must have returned the same octets; one that ignores it, as
  # Stalwart 0.16 does, answers 200 with the whole blob, and jmapc must have
  # refused it rather than return the start of the blob as the part.
  - name: Ask for the same range directly
    uses: http
    with:
      get: "/jmap/download/{{outputs.blob.accountId}}/{{outputs.blob.blobId}}/blob.txt?accept=text/plain"
      headers:
        range: bytes=5-12
    test: |
      res.code == 206 && outputs.blob.rangeIgnored == false && res.body == outputs.blob.part &&
        outputs.blob.part == ('blob ' + vars.run_id + ' 0123456789')[5:13] ||
      res.code == 200 && outputs.blob.part == '' && outputs.blob.rangeIgnored == true

- name: Changes followed through jmapc, a few at a time
  needs: [server, driver]
  defaults: *alice
  steps:
  - name: Read the state through jmapc
    id: before_changes
    uses: shell
    with:
      cmd: "{{vars.work}}/driver state"
    test: res.code == 0 && res.json.state != ""
    outputs:
      since: res.json.state

  - name: Deliver three messages to alice
    uses: smtp
    with:
      to: "alice@{{vars.domain}}"
      subject: "changed {{vars.run_id}}"
      session: 1
      message: 3
    test: res.code == 0 && res.sent == 3

  # Asking for one change at a time makes the server report more, and jmapc
  # has to follow hasMoreChanges to find all three. Other scenarios deliver
  # to the same inbox at the same time, so only the subjects of this one are
  # counted.
  - name: Follow the changes through the generated client
    uses: shell
    with:
      cmd: "{{vars.work}}/driver changes -since '{{outputs.before_changes.since}}' -max 1"
    retry: {max_attempts: 20, interval: 1s}
    test: |
      res.code == 0 &&
      count(res.json.created ?? [], {# startsWith 'changed ' + vars.run_id}) == 3 &&
      res.json.requests >= 3

  - name: See the server page the same changes directly
    uses: *jmap
    with:
      calls:
      - method: Email/changes
        id: changes
        args: {sinceState: "{{outputs.before_changes.since}}", maxChanges: 1}
    # One change at most, which may be an update rather than a creation: the
    # IMAP scenario marks a message read in the same inbox at the same time.
    test: |
      status == 0 &&
      res.results.changes.hasMoreChanges == true &&
      len(res.results.changes.created) +
        len(res.results.changes.updated) +
        len(res.results.changes.destroyed) == 1

# Every other scenario works in alice's account, at the same time as this
# one, and a push for any of their changes would run the watch again and find
# the message whether or not its own push arrived. Bob's account has nothing
# else happening in it, so the delivery below is the only change a push can
# report there.
- name: A push followed through jmapc's Watch
  needs: [server, driver]
  defaults:
    smtp: *remote_smtp
    shell:
      env:
        JMAPC_E2E_SESSION_URL: "{{vars.base}}/.well-known/jmap"
        JMAPC_E2E_USER: "bob@{{vars.domain}}"
        JMAPC_E2E_PASSWORD: "{{vars.bob_password}}"
  steps:
  - name: Read the state through jmapc
    id: before_push
    uses: shell
    with:
      cmd: "{{vars.work}}/driver state"
    test: res.code == 0 && res.json.state != ""
    outputs:
      since: res.json.state

  # The watch runs in the background, and the step returns once it says its
  # event stream is open. Watch does not poll, so an email it reports reached
  # it by push. probe gives back the process and the file its output goes to.
  - name: Start watching through the generated client
    id: watching
    uses: shell
    with:
      cmd: "{{vars.work}}/driver watch -since '{{outputs.before_push.since}}' -subject 'pushed {{vars.run_id}}'"
      background: true
      ready:
        log: following pushes
    test: status == -1
    outputs:
      log: res.log

  - name: Deliver to bob on port 25
    uses: smtp
    with:
      to: "bob@{{vars.domain}}"
      subject: "pushed {{vars.run_id}}"
    test: res.code == 0 && res.sent == 1

  # The first run of the request is the catch-up when the stream opens, so the
  # email has to arrive in a later one, which only a push starts. The email is
  # the last line of the log, after the one the step above waited for.
  - name: See the watch report it
    uses: shell
    with:
      cmd: "tail -n 1 '{{outputs.watching.log}}'"
    retry: {max_attempts: 20, interval: 1s}
    test: |
      res.code == 0 &&
      res.json?.subject startsWith 'pushed ' + vars.run_id &&
      res.json.runs >= 2

# Carol's account is this scenario's alone, as bob's is the Watch's: a push
# for any other change there would satisfy it whether or not the delivery
# below was pushed.
- name: A push to a URL, received by PushReceiver
  needs: [server, driver]
  defaults:
    *jmap :
      url: "{{vars.base}}"
      basic_auth:
        username: "carol@{{vars.domain}}"
        password: "{{vars.carol_password}}"
    smtp: *remote_smtp
    shell:
      env:
        JMAPC_E2E_SESSION_URL: "{{vars.base}}/.well-known/jmap"
        JMAPC_E2E_USER: "carol@{{vars.domain}}"
        JMAPC_E2E_PASSWORD: "{{vars.carol_password}}"
  steps:
  # The driver serves PushReceiver over https on the host, subscribes carol
  # to it, and ends once a change to her email is pushed, removing the
  # subscription as it does. The step returns once the server has verified
  # the subscription.
  - name: Receive pushes through PushReceiver
    id: receiving
    uses: shell
    with:
      cmd: >-
        {{vars.work}}/driver receive
        -url https://{{vars.push_host}}:{{vars.push_port}}/push/{{vars.run_id}}
        -listen :{{vars.push_port}}
        -cert {{vars.work}}/push.pem -key {{vars.work}}/push.key
      background: true
      ready:
        log: '"event":"verified"'
    test: status == -1
    outputs:
      log: res.log

  - name: Find the subscription directly
    uses: *jmap
    with:
      calls:
      - method: PushSubscription/get
        id: subs
        args: {ids: null}
    test: |
      status == 0 &&
      len(res.results.subs.list) == 1 &&
      res.results.subs.list[0].deviceClientId == 'jmapc-e2e'

  - name: Deliver to carol on port 25
    uses: smtp
    with:
      to: "carol@{{vars.domain}}"
      subject: "pushed to a URL {{vars.run_id}}"
    test: res.code == 0 && res.sent == 1

  # The driver writes one line of JSON for each thing it is told: each step
  # of the subscription, and each state change.
  - name: See the push received and the subscription removed
    uses: shell
    with:
      cmd: "cat '{{outputs.receiving.log}}'"
    retry: {max_attempts: 20, interval: 1s}
    test: |
      res.code == 0 &&
      res.stdout contains '"event":"verified"' &&
      res.stdout contains '"Email"' &&
      res.stdout contains '"event":"destroyed"'

  - name: Find no subscription directly
    uses: *jmap
    with:
      calls:
      - method: PushSubscription/get
