# The scenarios. Each one does something through jmapc and checks it over a
# path that does not go through jmapc, or the other way round, so that a
# mistake in what jmapc sends cannot be hidden by the same mistake in what it
# reads back.
#
# Outputs are kept for the whole run and can be read by name alone, so an
# output is not named after the id of any step: outputs.account.id would
# otherwise find the output named account rather than the step.
name: jmapc against Stalwart

jobs:
- name: The session as jmapc reads it
  defaults:
    http:
      url: "{{vars.base}}"
      headers:
        authorization: "Basic {{encode_base64('alice@' + vars.domain + ':' + vars.alice_password)}}"
  steps:
  - name: Fetch the session directly
    id: raw
    uses: http
    with:
      get: /.well-known/jmap
    test: res.code == 200
    outputs:
      username: res.body.username
      apiUrl: res.body.apiUrl
      downloadUrl: res.body.downloadUrl
      uploadUrl: res.body.uploadUrl
      eventSourceUrl: res.body.eventSourceUrl
      mailAccountId: res.body.primaryAccounts['urn:ietf:params:jmap:mail']
      capabilities: toJSON(sort(keys(res.body.capabilities)))
      maxCallsInRequest: res.body.capabilities['urn:ietf:params:jmap:core'].maxCallsInRequest
      maxObjectsInGet: res.body.capabilities['urn:ietf:params:jmap:core'].maxObjectsInGet

  - name: Fetch it through jmapc
    uses: shell
    with:
      cmd: "{{vars.driver}} session"
      env:
        JMAPC_E2E_SESSION_URL: "{{vars.base}}/.well-known/jmap"
        JMAPC_E2E_USER: "alice@{{vars.domain}}"
        JMAPC_E2E_PASSWORD: "{{vars.alice_password}}"
    test: |
      res.code == 0 &&
      parse_json(res.stdout).username == outputs.raw.username &&
      parse_json(res.stdout).apiUrl == outputs.raw.apiUrl &&
      parse_json(res.stdout).downloadUrl == outputs.raw.downloadUrl &&
      parse_json(res.stdout).uploadUrl == outputs.raw.uploadUrl &&
      parse_json(res.stdout).eventSourceUrl == outputs.raw.eventSourceUrl &&
      parse_json(res.stdout).mailAccountId == outputs.raw.mailAccountId &&
      toJSON(parse_json(res.stdout).capabilities) == outputs.raw.capabilities &&
      parse_json(res.stdout).maxCallsInRequest == outputs.raw.maxCallsInRequest &&
      parse_json(res.stdout).maxObjectsInGet == outputs.raw.maxObjectsInGet

- name: Mail delivered over SMTP, found through jmapc
  steps:
  # The subject carries the run id, and probe appends a tracking id of its
  # own, so the search below matches this delivery and no other.
  - name: Deliver to alice on port 25
    uses: smtp
    with:
      addr: "{{vars.smtp}}"
      myhostname: mail.remote.test
      from: someone@remote.test
      to: "alice@{{vars.domain}}"
      subject: "inbound {{vars.run_id}}"
    test: res.code == 0 && res.sent == 1

  - name: Find it through the generated client
    id: found
    uses: shell
    with:
      cmd: "{{vars.driver}} find-emails -subject 'inbound {{vars.run_id}}'"
      env:
        JMAPC_E2E_SESSION_URL: "{{vars.base}}/.well-known/jmap"
        JMAPC_E2E_USER: "alice@{{vars.domain}}"
        JMAPC_E2E_PASSWORD: "{{vars.alice_password}}"
    retry: {max_attempts: 20, interval: 1s}
    test: |
      res.code == 0 &&
      parse_json(res.stdout).count == 1 &&
      parse_json(res.stdout).emails[0].from[0] == 'someone@remote.test' &&
      parse_json(res.stdout).emails[0].to[0] == 'alice@' + vars.domain &&
      parse_json(res.stdout).emails[0].mailboxes == 1
    outputs:
      id: parse_json(res.stdout).emails[0].id

  # A request written by hand names the account, which jmapc fills in from the
  # session where a request leaves it out.
  - name: Read alice's mail account
    id: account
    uses: http
    with:
      url: "{{vars.base}}"
      get: /.well-known/jmap
      headers:
        authorization: "Basic {{encode_base64('alice@' + vars.domain + ':' + vars.alice_password)}}"
    test: res.code == 200
    outputs:
      id: res.body.primaryAccounts['urn:ietf:params:jmap:mail']

  - name: Find the same email directly
    uses: http
    with:
      url: "{{vars.base}}"
      post: /jmap/
      headers:
        authorization: "Basic {{encode_base64('alice@' + vars.domain + ':' + vars.alice_password)}}"
        content-type: application/json
      body:
        using: ["urn:ietf:params:jmap:core", "urn:ietf:params:jmap:mail"]
        methodCalls:
        - [Email/query, {accountId: "{{outputs.account.id}}", filter: {subject: "inbound {{vars.run_id}}"}}, search]
    test: res.code == 200 && res.body.methodResponses[0][1].ids == [outputs.found.id]

- name: Mail imported through jmapc, read over IMAP
  defaults:
    imap:
      host: "{{vars.imap_host}}"
      port: "{{vars.imap_port}}"
      username: "alice@{{vars.domain}}"
      password: "{{vars.alice_password}}"
      # The certificate is the one Stalwart makes for itself, for a name
      # nothing here resolves.
      insecure_skip_tls: true
  steps:
  - name: Import a flagged message through the generated client
    id: imported
    uses: shell
    with:
      cmd: "{{vars.driver}} import-email -subject 'imported {{vars.run_id}}'"
      env:
        JMAPC_E2E_SESSION_URL: "{{vars.base}}/.well-known/jmap"
        JMAPC_E2E_USER: "alice@{{vars.domain}}"
        JMAPC_E2E_PASSWORD: "{{vars.alice_password}}"
    test: res.code == 0 && parse_json(res.stdout).id != ""
    outputs:
      id: parse_json(res.stdout).id

  # The keywords set through JMAP are the flags IMAP shows: $flagged is
  # \Flagged, and a message not yet read has no \Seen. The fetch acts on what
  # the search found.
  - name: Find it in the inbox over IMAP, flagged and unread
    uses: imap
    with:
      commands:
      - name: select
        mailbox: INBOX
      - name: uid search
        criteria:
          headers:
            Subject: "imported {{vars.run_id}}"
      - name: uid fetch
        dataitem: ALL
    test: |
      status == 0 &&
      res.data.search.count == 1 &&
      len(res.data.fetch.messages) == 1 &&
      res.data.fetch.messages[0].subject == 'imported ' + vars.run_id &&
      '\\Flagged' in res.data.fetch.messages[0].flags &&
      !('\\Seen' in res.data.fetch.messages[0].flags)

  # A change made over IMAP, for jmapc to see.
  - name: Mark it read over IMAP
    uses: imap
    with:
      commands:
      - name: select
        mailbox: INBOX
      - name: uid search
        criteria:
          headers:
            Subject: "imported {{vars.run_id}}"
      - name: uid store
        dataitem: +FLAGS
        value: '\Seen'
    test: status == 0 && res.data.store.count == 1

  - name: See it read through the generated client
    uses: shell
    with:
      cmd: "{{vars.driver}} find-emails -subject 'imported {{vars.run_id}}'"
      env:
        JMAPC_E2E_SESSION_URL: "{{vars.base}}/.well-known/jmap"
        JMAPC_E2E_USER: "alice@{{vars.domain}}"
        JMAPC_E2E_PASSWORD: "{{vars.alice_password}}"
    test: |
      res.code == 0 &&
      parse_json(res.stdout).count == 1 &&
      parse_json(res.stdout).emails[0].id == outputs.imported.id &&
      parse_json(res.stdout).emails[0].keywords == ['$flagged', '$seen']

- name: A blob uploaded through jmapc, downloaded directly
  defaults:
    http:
      url: "{{vars.base}}"
      headers:
        authorization: "Basic {{encode_base64('alice@' + vars.domain + ':' + vars.alice_password)}}"
  steps:
  # jmapc uploads the content and reads back the whole of it, and asks for
  # octets 5 to 12 of it.
  - name: Upload and download it through jmapc
    id: blob
    uses: shell
    with:
      cmd: "{{vars.driver}} blob -data 'blob {{vars.run_id}} 0123456789' -from 5 -length 8"
      env:
        JMAPC_E2E_SESSION_URL: "{{vars.base}}/.well-known/jmap"
        JMAPC_E2E_USER: "alice@{{vars.domain}}"
        JMAPC_E2E_PASSWORD: "{{vars.alice_password}}"
    test: |
      res.code == 0 &&
      parse_json(res.stdout).whole == 'blob ' + vars.run_id + ' 0123456789' &&
      parse_json(res.stdout).size == len('blob ' + vars.run_id + ' 0123456789')
    outputs:
      accountId: parse_json(res.stdout).accountId
      blobId: parse_json(res.stdout).blobId
      part: parse_json(res.stdout).part ?? ''
      rangeError: parse_json(res.stdout).rangeError ?? ''

  - name: Download the whole of it directly
    uses: http
    with:
      get: "/jmap/download/{{outputs.blob.accountId}}/{{outputs.blob.blobId}}/blob.txt?accept=text/plain"
    test: res.code == 200 && res.body == 'blob ' + vars.run_id + ' 0123456789'

  # JMAP leaves ranges to the server. One that honours the range answers 206,
  # and jmapc must have returned the same octets; one that ignores it, as
  # Stalwart 0.16 does, answers 200 with the whole blob, and jmapc must have
  # refused it rather than return the start of the blob as the part.
  - name: Ask for the same range directly
    uses: http
    with:
      get: "/jmap/download/{{outputs.blob.accountId}}/{{outputs.blob.blobId}}/blob.txt?accept=text/plain"
      headers:
        range: bytes=5-12
    test: |
      res.code == 206 && outputs.blob.rangeError == '' && res.body == outputs.blob.part &&
        outputs.blob.part == ('blob ' + vars.run_id + ' 0123456789')[5:13] ||
      res.code == 200 && outputs.blob.part == '' && outputs.blob.rangeError contains 'ignored the range'

- name: Changes followed through jmapc, a few at a time
  steps:
  - name: Read the state through jmapc
    id: before_changes
    uses: shell
    with:
      cmd: "{{vars.driver}} state"
      env:
        JMAPC_E2E_SESSION_URL: "{{vars.base}}/.well-known/jmap"
        JMAPC_E2E_USER: "alice@{{vars.domain}}"
        JMAPC_E2E_PASSWORD: "{{vars.alice_password}}"
    test: res.code == 0 && parse_json(res.stdout).state != ""
    outputs:
      since: parse_json(res.stdout).state

  - name: Deliver three messages to alice
    uses: smtp
    with:
      addr: "{{vars.smtp}}"
      myhostname: mail.remote.test
      from: someone@remote.test
      to: "alice@{{vars.domain}}"
      subject: "changed {{vars.run_id}}"
      session: 1
      message: 3
    test: res.code == 0 && res.sent == 3

  # Asking for one change at a time makes the server report more, and jmapc
  # has to follow hasMoreChanges to find all three. Other scenarios deliver
  # to the same inbox at the same time, so only the subjects of this one are
  # counted.
  - name: Follow the changes through the generated client
    uses: shell
    with:
      cmd: "{{vars.driver}} changes -since '{{outputs.before_changes.since}}' -max 1"
      env:
        JMAPC_E2E_SESSION_URL: "{{vars.base}}/.well-known/jmap"
        JMAPC_E2E_USER: "alice@{{vars.domain}}"
        JMAPC_E2E_PASSWORD: "{{vars.alice_password}}"
    retry: {max_attempts: 20, interval: 1s}
    test: |
      res.code == 0 &&
      count(parse_json(res.stdout).created ?? [], {# startsWith 'changed ' + vars.run_id}) == 3 &&
      parse_json(res.stdout).requests >= 3

  - name: Read alice's mail account for the direct request
    id: changes_account
    uses: http
    with:
      url: "{{vars.base}}"
      get: /.well-known/jmap
      headers:
        authorization: "Basic {{encode_base64('alice@' + vars.domain + ':' + vars.alice_password)}}"
    test: res.code == 200
    outputs:
      accountId: res.body.primaryAccounts['urn:ietf:params:jmap:mail']

  - name: See the server page the same changes directly
    uses: http
    with:
      url: "{{vars.base}}"
      post: /jmap/
      headers:
        authorization: "Basic {{encode_base64('alice@' + vars.domain + ':' + vars.alice_password)}}"
        content-type: application/json
      body:
        using: ["urn:ietf:params:jmap:core", "urn:ietf:params:jmap:mail"]
        methodCalls:
        - [Email/changes, {accountId: "{{outputs.changes_account.accountId}}", sinceState: "{{outputs.before_changes.since}}", maxChanges: 1}, changes]
    # One change at most, which may be an update rather than a creation: the
    # IMAP scenario marks a message read in the same inbox at the same time.
    test: |
      res.code == 200 &&
      res.body.methodResponses[0][0] == 'Email/changes' &&
      res.body.methodResponses[0][1].hasMoreChanges == true &&
      len(res.body.methodResponses[0][1].created) +
        len(res.body.methodResponses[0][1].updated) +
        len(res.body.methodResponses[0][1].destroyed) == 1

- name: A push followed through jmapc's Watch
  steps:
  - name: Read the state through jmapc
    id: before_push
    uses: shell
    with:
      cmd: "{{vars.driver}} state"
      env:
        JMAPC_E2E_SESSION_URL: "{{vars.base}}/.well-known/jmap"
        JMAPC_E2E_USER: "alice@{{vars.domain}}"
        JMAPC_E2E_PASSWORD: "{{vars.alice_password}}"
    test: res.code == 0 && parse_json(res.stdout).state != ""
    outputs:
      since: parse_json(res.stdout).state

  # The watch runs in the background, and creates the ready file once its
  # event stream is open. Watch does not poll, so an email it reports reached
  # it by push. probe gives back the process and the file its output goes to.
  - name: Start watching through the generated client
    id: watching
    uses: shell
    with:
      cmd: "{{vars.driver}} watch -since '{{outputs.before_push.since}}' -subject 'pushed {{vars.run_id}}' -ready '{{vars.work}}/watch.ready'"
      background: true
      env:
        JMAPC_E2E_SESSION_URL: "{{vars.base}}/.well-known/jmap"
        JMAPC_E2E_USER: "alice@{{vars.domain}}"
        JMAPC_E2E_PASSWORD: "{{vars.alice_password}}"
    test: res.pid > 0 && res.log != ""
    outputs:
      log: res.log

  - name: Wait until the watch follows pushes
    uses: shell
    with:
      cmd: "test -f '{{vars.work}}/watch.ready'"
    retry: {max_attempts: 20, interval: 500ms}
    test: res.code == 0

  - name: Deliver to alice on port 25
    uses: smtp
    with:
      addr: "{{vars.smtp}}"
      myhostname: mail.remote.test
      from: someone@remote.test
      to: "alice@{{vars.domain}}"
      subject: "pushed {{vars.run_id}}"
    test: res.code == 0 && res.sent == 1

  # The first run of the request is the catch-up when the stream opens, so the
  # email has to arrive in a later one, which only a push starts.
  - name: See the watch report it
    uses: shell
    with:
      cmd: "cat '{{outputs.watching.log}}'"
    retry: {max_attempts: 20, interval: 1s}
    test: |
      res.code == 0 &&
      res.stdout contains '"subject"' &&
      parse_json(res.stdout).subject startsWith 'pushed ' + vars.run_id &&
      parse_json(res.stdout).runs >= 2
