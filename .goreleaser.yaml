# goreleaser builds the jmapc binaries published with each release.
#
# A Go project is better served by `go get -tool`, which pins a version in its
# own go.mod, so that everyone who builds the project — CI included —
# generates with the same one. The binaries are for the projects that cannot:
# jmapc generates TypeScript and Rust from the same queries, and those are
# users who need not have a Go toolchain at all.
version: 2

project_name: jmapc

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: jmapc
    main: ./cmd/jmapc
    binary: jmapc
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Trim the build and stamp the version, so that `jmapc version` reports
    # what was released rather than "(devel)".
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: jmapc
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  use: github
  groups:
    - title: Changes
      order: 0
  filters:
    exclude:
      - "^ci:"
      - "^docs:"
      - "^test:"
      - "^Merge pull request"

release:
  # The tag is pushed once the work is on main, so the release is not a draft.
  draft: false
  prerelease: auto
  footer: |
    ## Install

    The generator is a Go tool, and what it generates is Go, so the usual way
    is to record it in the module that uses it:

    ```
    go get -tool github.com/linyows/jmapc/cmd/jmapc@{{ .Tag }}
    ```

    Binaries are attached below for anyone without a Go toolchain.
